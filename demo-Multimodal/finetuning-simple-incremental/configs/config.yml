# Configuración FASE 2: DEIMv2 Multimodal Fine-Tuning (CORREGIDO)
# Objetivo: Entrenar solo la cabecera de fusión
# Base: DINOv3 + DEIMv2

__include__: [
  '../../../scripts/deimv2_multimodal/configs/deimv2_industrial_defects.yml'
]

# -------------------------------------------------------------------------
# 1. OPTIMIZADOR Y SCHEDULE
# -------------------------------------------------------------------------
optimizer:
  type: AdamW
  lr: 0.0001
  betas: [0.9, 0.999]
  weight_decay: 0.01

lr_scheduler:
  type: MultiStepLR
  milestones: [30]
  gamma: 0.1

# -------------------------------------------------------------------------
# 2. MODELO Y DATASET
# -------------------------------------------------------------------------
num_classes: 6 
remap_mscoco_category: False

train_dataloader: 
  dataset: 
    transforms:
      ops:
        - {type: Resize, size: [1024, 1024]} 
        - {type: ToTensor}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  shuffle: True
  # CORRECCIÓN AQUÍ: Usamos total_batch_size para sobrescribir la base y evitar conflicto
  total_batch_size: 2  
  num_workers: 0
  drop_last: True 

val_dataloader:
  dataset:
    transforms:
      ops:
        - {type: Resize, size: [1024, 1024]}
        - {type: ToTensor}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
  shuffle: False
  # CORRECCIÓN AQUÍ TAMBIÉN
  total_batch_size: 2
  num_workers: 0

# -------------------------------------------------------------------------
# 3. LOSSES Y MATCHER
# -------------------------------------------------------------------------
criterion:
  type: DEIMCriterion
  matcher:
    type: HungarianMatcher
    cost_class: 2.0
    cost_bbox: 5.0
    cost_giou: 2.0
    alpha: 0.25
    gamma: 2.0

  weight_dict:
    loss_class: 2.0
    loss_bbox: 0.0        # Congelado
    loss_giou: 0.0        # Congelado
    loss_vfl: 0.0
    loss_focal: 2.0
    
  losses: ['focal']

postprocessor:
  type: DEIMPostProcessor
  num_top_queries: 300
  num_classes: 6
  use_focal_loss: True